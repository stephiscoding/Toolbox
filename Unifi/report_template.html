<!doctype html>
<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            margin: 20px;
        }

        h1 {
            font-size: 1.6em;
            margin-bottom: 4px;
            text-align: center;
        }

        h2 {
            font-size: 1em;
            font-weight: normal;
            color: #777;
            margin-top: 0;
            text-align: center;
        }

        h3 {
            font-size: 0.95em;
            font-weight: bolder;
            color: #222;
            margin-top: 0;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 16px;
        }

        th, td {
            text-align: left;
            padding: 8px 12px;
            border: 1px solid #ddd;
        }

        thead th {
            background-color: #4a4a4a;
            color: #fff;
            font-weight: bold;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e6f0ff;
        }
    </style>
</head>
